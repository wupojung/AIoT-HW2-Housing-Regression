name: Phase 5 JSON Schema Contract
on:
  push:
    paths:
      - 'docs/ui-ux/case-package/phase-05/**'
      - '.github/workflows/phase5-schema-contract.yml'
  pull_request:
    paths:
      - 'docs/ui-ux/case-package/phase-05/**'
      - '.github/workflows/phase5-schema-contract.yml'
  workflow_dispatch:
jobs:
  phase5-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned JSON Schema validator
        run: python -m pip install jsonschema==4.26.0
      - name: Validate positive and negative Phase 5 synthetic fixtures
        run: python docs/ui-ux/case-package/phase-05/test_schema.py
