name: RegScope JSON Schema Contracts
on:
  push:
    paths:
      - 'docs/ui-ux/case-package/phase-05/**'
      - 'docs/design/tools/validate_schema.py'
      - 'docs/design/data-contracts/**'
      - 'docs/ui-ux/case-package/sample/**'
      - '.github/workflows/phase5-schema-contract.yml'
  pull_request:
    paths:
      - 'docs/ui-ux/case-package/phase-05/**'
      - '.github/workflows/phase5-schema-contract.yml'
  workflow_dispatch:
jobs:
  phase5-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned JSON Schema validator
        run: python -m pip install 'jsonschema[format]==4.26.0'
      - name: Validate Phase 1 2 3 4 6 sample contracts
        run: |
          for n in 01 02 03 04 06; do
            case "$n" in
              01) file=phase-01/content.json ;;
              02) file=phase-02/analyses.json ;;
              03) file=phase-03/preparation.json ;;
              04) file=phase-04/modeling.json ;;
              06) file=phase-06/inference-catalog.json ;;
            esac
            python docs/design/tools/validate_schema.py --schema "docs/design/data-contracts/schemas/phase-$n.schema.json" "docs/ui-ux/case-package/sample/ames-housing/phases/$file"
          done
      - name: Validate Phase 5 sample schema (simple local entrypoint)
        run: |
          python docs/design/tools/validate_schema.py --schema docs/ui-ux/case-package/phase-05/evaluation-index.schema.json docs/ui-ux/case-package/phase-05/sample/evaluations.json docs/ui-ux/case-package/phase-05/sample/evaluations.nonempty.mock.json
      - name: Validate positive and negative Phase 5 synthetic fixtures
        run: python docs/ui-ux/case-package/phase-05/test_schema.py
