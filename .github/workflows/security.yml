name: Security scan

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned pip
        run: python -m pip install --upgrade pip==26.2.2
      - name: Install locked Python environment
        run: python -m pip install -r requirements.lock
      - name: Scan tracked repository files
        run: python tools/security_scan.py --tracked
      - name: Run environment smoke test
        run: python python/src/environment_check.py
      - name: Run complete Python test suite
        run: python -m pytest -q
