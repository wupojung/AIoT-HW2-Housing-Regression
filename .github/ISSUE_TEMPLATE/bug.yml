name: Bug report
description: Report a reproducible project issue
title: "[Bug]: "
labels: ["type: bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: markdown
    attributes:
      value: "Do not attach credentials, private data, raw datasets, or local research files."
